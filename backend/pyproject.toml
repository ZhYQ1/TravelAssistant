[project]
name = "travel-assistant"
version = "0.1.0"
description = "多 Agent 协作智能差旅助手：三级意图识别与路由链路"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "redis>=5.0",
  "python-dotenv>=1.0",
  "agentscope>=1.0.21,<2",
  "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: 需要真实 Redis / Embedding / LLM 服务",
]